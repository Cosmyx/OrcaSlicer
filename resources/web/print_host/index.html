<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' data:; img-src data:;">
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="panel">
  <h1>{TITLE}</h1>

  <div class="row">
    <label for="fname">{FILENAME_LABEL}</label>
    <input id="fname" type="text" placeholder="{PLACEHOLDER}" value="{FILENAME}"/>
  </div>

  <div class="checks">
    <label><input id="c1" type="checkbox" {C1}/>{AUTO_PRINT_LABEL}</label>
    <label><input id="c2" type="checkbox" {C2}/>{DEL_AFTER_PRINT}</label>
  </div>

  <div class="btnbar">
    <button id="go" onclick="(function(){
        const c1=document.getElementById('c1').checked?1:0;
        const c2=document.getElementById('c2').checked?1:0;
        const f =document.getElementById('fname').value;
        location.href='app://submit?c1='+c1+'&c2='+c2+'&f='+encodeURIComponent(f);
    })()">{VALIDATE_LABEL}</button>
  </div>
</div>
</body>
</html>
