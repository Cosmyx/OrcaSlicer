<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="max-age=7200" />
<title>引导_P24</title>
<link rel="stylesheet" type="text/css" href="../css/common.css" />
<link rel="stylesheet" type="text/css" href="24.css" />
<link rel="stylesheet" type="text/css" href="../css/dark.css" />
<!-- <script type="text/javascript" src="test.js"></script> -->
<script type="text/javascript" src="../js/jquery-3.6.0.min.js"></script>
<script type="text/javascript" src="../js/json2.js"></script>
<script type="text/javascript" src="../../data/text.js"></script>
<script type="text/javascript" src="../js/globalapi.js"></script>
<!-- <script type="text/javascript" src="../js/common.js"></script> -->
<script type="text/javascript" src="24.js"></script>
</head>
<body onLoad="OnInit()">
<div id="Title">
	<div class="trans" tid="t10">Printer Selection</div>
</div>
<div id="Content" class="ZScrol">
  <div id="leftBlock">
    <div id="vendorFilterShow">
      <div id="vendorFilterBtn" class="CNameBlock">
        <img class="inlineAlign CNameIcon" src="../img/vendor.svg" />
        <span class="trans inlineAlign" tid="t17">vendor</span>
        <div class="CArrow inlineAlign"></div>
      </div>
      <div id="VendorFilterList" class="CValues">
        <div class="checkboxText"><input type="checkbox" id="VendorAll" onClick="ChooseAllVendor()" /><span class="trans" tid="t11">all</span></div>
      </div>
    </div>
  </div>
  <div id="rightBlock">
    <div class="wrap">
      <input type="text" class="searchTerm" placeholder="Device keyword" oninput="textInput(this)">
      <svg id="search-icon" width="16px" height="16px">
        <path d="M6.5,2A4.505,4.505,0,0,0,2,6.5a.5.5,0,0,0,1,0A3.5,3.5,0,0,1,6.5,3a.5.5,0,0,0,0-1Z"/>
        <path d="M14.854,14.146l-3.423-3.422a6.518,6.518,0,1,0-.707.707l3.422,3.423a.5.5,0,0,0,.708-.708ZM1,6.5A5.5,5.5,0,1,1,6.5,12,5.507,5.507,0,0,1,1,6.5Z"/>
      </svg>
    </div>
    <div id="PrinterGrid">
    </div>
  </div>
</div>
<div id="AcceptArea">
	<div class="NormalBtn trans" tid="t39" id="AcceptBtn" onclick="ConfirmSelect()">Confirm</div>
	<div class="GrayBtn trans" tid="t38" id="PreBtn" onclick="CancelSelect()">Cancel</div>
</div>

<div id="NoticeMask"></div>
<div id="NoticeBody">
	<div id="NoticeBar" class="trans" tid="t18">error</div>
	<div id="NoticeContent">
	<div id="NoticeText" class="trans" tid="t37">At least one printer must be selected.</div>
	<div id="NoticeBtns">
		<div class="SmallBtn trans" tid="t36" onClick="ShowNotice(0)">ok</div>
	</div>
	</div>
</div>

</body>
<script>
	document.onkeydown = function (event) {
		var e = event || window.event || arguments.callee.caller.arguments[0];

		if (e.keyCode == 27)
			ClosePage();

		if (window.event) {
			try { e.keyCode = 0; } catch (e) { }
			e.returnValue = true;
		}
	};
	let pModel = {};
	let ModelNozzleSelected = {};
	function textInput(obj) {
		FilterModelList(obj.value);
	}
</script>
</html>
