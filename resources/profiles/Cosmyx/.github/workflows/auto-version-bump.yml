name: Auto Version Bump

on:
  push:
    branches:
      - main

jobs:
  version-bump:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Check if this is a merge commit
        id: check_merge
        run: |
          # Check if this is a merge commit (has 2 parents)
          if [ $(git rev-list --parents -n 1 HEAD | wc -w) -gt 2 ]; then
            echo "is_merge=true" >> $GITHUB_OUTPUT
            echo "This is a merge commit"
          else
            echo "is_merge=false" >> $GITHUB_OUTPUT
            echo "This is not a merge commit"
          fi

      - name: Generate new version number
        if: steps.check_merge.outputs.is_merge == 'true'
        id: version
        run: |
          # Get current date
          DAY=$(date +%d)
          MONTH=$(date +%m)
          YEAR=$(date +%Y)

          # Get the last version increment from git history
          LAST_VERSION=$(git log --all --grep="chore: bump version to" --format=%B -n 1 | grep -oP 'version to \K\d+\.\d+\.\d+\.\d+' || echo "")

          if [ -z "$LAST_VERSION" ]; then
            # No previous version found, start with increment 1
            INCREMENT=1
          else
            # Extract the last increment number
            LAST_INCREMENT=$(echo $LAST_VERSION | cut -d'.' -f4)
            LAST_DATE=$(echo $LAST_VERSION | cut -d'.' -f1-3)
            CURRENT_DATE="${DAY}.${MONTH}.${YEAR}"

            if [ "$LAST_DATE" == "$CURRENT_DATE" ]; then
              # Same day, increment the version
              INCREMENT=$((LAST_INCREMENT + 1))
            else
              # New day, reset to 1
              INCREMENT=1
            fi
          fi

          # Format with leading zeros
          NEW_VERSION=$(printf "%02d.%02d.%02d.%02d" $DAY $MONTH $YEAR $INCREMENT)
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION"

      - name: Update version in all JSON files
        if: steps.check_merge.outputs.is_merge == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          echo "Updating version to: $NEW_VERSION"

          # Find all JSON files and update version field
          find . -name "*.json" -type f ! -path "./.git/*" -exec sed -i "s/\"version\": \"[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{2\}\"/\"version\": \"$NEW_VERSION\"/g" {} +

          # Also update the version in Python scripts if they have VERSION constant
          find . -name "*.py" -type f ! -path "./.git/*" -exec sed -i "s/VERSION = \"[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{2\}\.[0-9]\{2\}\"/VERSION = \"$NEW_VERSION\"/g" {} +

          echo "Version update complete"

      - name: Check for changes
        if: steps.check_merge.outputs.is_merge == 'true'
        id: verify_diff
        run: |
          if git diff --quiet .; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No version changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Version changes detected"
            git diff --stat
          fi

      - name: Commit and push version changes
        if: steps.check_merge.outputs.is_merge == 'true' && steps.verify_diff.outputs.changed == 'true'
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: bump version to $NEW_VERSION [skip ci]"
          git push
