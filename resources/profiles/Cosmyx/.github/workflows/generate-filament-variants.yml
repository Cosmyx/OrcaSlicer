name: Generate Filament Variants

on:
  push:
    branches:
      - main
    paths:
      - 'Common Filament library/**'

jobs:
  generate-variants:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Generate filament variants
        run: |
          echo "Running filament variant generation script..."
          python ztool_generate_filament_variants.py

      - name: Check for changes
        id: verify_diff
        run: |
          git diff --quiet . || echo "changed=true" >> $GITHUB_OUTPUT

      - name: Commit and push changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Machine/
          git commit -m "chore: regenerate filament variants from Common Filament library [skip ci]"
          git push
