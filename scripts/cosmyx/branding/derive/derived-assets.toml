# Branding rasters derived from the vendored SVG master by `just brand-derive` (derive.py, decisions 0124-0126).
# Never edit an output by hand: change the source or this list, run `just brand-derive`, then
# `just brand-refresh PATH` for each rewritten output (its row goes back to to-validate).
#
# [[derived]]
# source = "cosmyx-src/branding/overlay/..."  # repository-relative POSIX path of the SVG master
# output = "cosmyx-src/branding/overlay/..."  # repository-relative POSIX path of the generated file
# format = "png"                              # "png" (size: px, square), "ico" (size: list of px) or "icns"
# size = 154
# grayscale = false                           # png only: every pixel set to its BT.601 luma, alpha kept
#
# Sizes are those of the upstream file each output replaces, so the replacement keeps its dimensions.

# Windows executable and installer icon (OrcaSlicer.rc.in, CPack/NSIS).
[[derived]]
source = "cosmyx-src/branding/overlay/resources/images/OrcaSlicer.svg"
output = "cosmyx-src/branding/overlay/resources/images/OrcaSlicer.ico"
format = "ico"
size = [16, 32, 48, 64, 128, 256]

# Disabled-state logo in message dialogs (MsgDialog.cpp).
[[derived]]
source = "cosmyx-src/branding/overlay/resources/images/OrcaSlicer.svg"
output = "cosmyx-src/branding/overlay/resources/images/OrcaSlicer_192px_grayscale.png"
format = "png"
size = 192
grayscale = true

