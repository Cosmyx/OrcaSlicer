# Cosmyx upstream sync. Every two hours, and on demand:
#
# 1. mirror: Orca-Upstream becomes an exact copy of OrcaSlicer/OrcaSlicer main.
# 2. mixed: MIXED is rebuilt as DEV merged with Orca-Upstream and force-pushed.
#    A merge conflict fails the run and lists the files: with the zero conflict
#    rule, a conflict here is a bug to fix on DEV.
# 3. dispatch: build_all.yml is started on MIXED when MIXED moved.
# 4. workflow-policy: every scheduled workflow must be allowed or disabled by
#    .github/cosmyx/workflow-policy.json; the listed upstream bots are disabled.
#
# Scheduled workflows only run from the default branch (DEV), so this file
# lives on DEV, never on Orca-Upstream.
#
# Token: GITHUB_TOKEN cannot push commits that touch .github/workflows/, and
# upstream changes those files often. Store a fine-grained PAT on this
# repository with "Contents: read and write" and "Workflows: read and write"
# in the UPSTREAM_SYNC_TOKEN secret. Without it the run falls back to
# GITHUB_TOKEN with a warning and fails on such commits.
#
# Details: wiki/cosmyx/upstream-sync.md.
name: Cosmyx upstream sync

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Compute everything, push and dispatch nothing'
        type: boolean
        default: false

permissions:
  contents: write
  actions: write

concurrency:
  group: cosmyx-upstream-sync
  cancel-in-progress: false

env:
  DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
  UPSTREAM_SYNC_TOKEN: ${{ secrets.UPSTREAM_SYNC_TOKEN }}
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

jobs:
  mirror:
    name: Mirror upstream main into Orca-Upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/cosmyx
          persist-credentials: false

      - name: Mirror
        run: python3 scripts/cosmyx/upstream_sync.py mirror $DRY_RUN

  mixed:
    name: Rebuild MIXED (DEV + Orca-Upstream)
    needs: mirror
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.mixed.outputs.changed }}
      sha: ${{ steps.mixed.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/cosmyx
          persist-credentials: false

      - name: Merge and push MIXED
        id: mixed
        # Exit code 2 means a merge conflict; the files are in the summary.
        run: python3 scripts/cosmyx/upstream_sync.py mixed $DRY_RUN

  dispatch:
    name: Build MIXED
    needs: mixed
    if: needs.mixed.outputs.changed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      MIXED_SHA: ${{ needs.mixed.outputs.sha }}
    steps:
      - name: Start build_all.yml on MIXED
        run: |
          set -euo pipefail
          gh workflow run build_all.yml --repo "$GITHUB_REPOSITORY" --ref MIXED
          # The dispatch API returns no run id: look the run up by branch and commit.
          url=""
          for _ in 1 2 3 4 5 6; do
            sleep 10
            url=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build_all.yml --branch MIXED \
              --event workflow_dispatch --commit "$MIXED_SHA" --limit 1 --json url --jq '.[0].url // ""')
            [ -n "$url" ] && break
          done
          echo "build_all on MIXED: ${url:-not listed yet}"
          echo "### build_all started on MIXED" >> "$GITHUB_STEP_SUMMARY"
          echo "${url:-Run not listed yet; see the Build all workflow page.}" >> "$GITHUB_STEP_SUMMARY"

  workflow-policy:
    name: Scheduled workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: |
            .github
            scripts/cosmyx
          persist-credentials: false

      - name: Check and apply the policy
        run: |
          if [ -n "$DRY_RUN" ]; then
            python3 scripts/cosmyx/upstream_sync.py workflow-policy
          else
            python3 scripts/cosmyx/upstream_sync.py workflow-policy --apply --repo "$GITHUB_REPOSITORY"
          fi
