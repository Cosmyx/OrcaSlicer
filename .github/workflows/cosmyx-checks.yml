# Cosmyx checks: runs the tooling script tests on every OS. C++ changes are
# compiled and tested by build_all.yml (cosmyx_tests runs with the upstream
# suites through ctest).
name: Cosmyx checks

on:
  pull_request:
    branches:
      - DEV
    paths:
      - 'justfile'
      - 'CHANGELOG.md'
      - 'scripts/cosmyx/**'
      - 'wiki/**'
      - '.github/workflows/cosmyx-checks.yml'
      - 'cosmyx/**'
      - '.github/actions/**'
      - '.github/cosmyx/**'
      - '.github/workflows/cosmyx-*.yml'
      - 'localization/cosmyx/**'
      - 'scripts/sign_windows.ps1'
  push:
    branches:
      - DEV
    paths:
      - 'justfile'
      - 'CHANGELOG.md'
      - 'scripts/cosmyx/**'
      - 'wiki/**'
      - '.github/workflows/cosmyx-checks.yml'
      - 'cosmyx/**'
      - '.github/actions/**'
      - '.github/cosmyx/**'
      - '.github/workflows/cosmyx-*.yml'
      - 'localization/cosmyx/**'
      - 'scripts/sign_windows.ps1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cosmyx-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-scripts:
    name: Script tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install just
        uses: taiki-e/install-action@v2
        with:
          tool: just@1.40.0

      - name: Run the script tests
        # Windows runners ship PowerShell with Pester, so Pester tests must run
        # there instead of being skipped.
        env:
          COSMYX_REQUIRE_PESTER: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: just test-scripts

      - name: Check the decision register
        run: just decisions
