name: Cosmyx Regenerate JSON

on:
  push:
    branches:
      - cosmyx
      - main
    paths:
      - 'resources/profiles/Cosmyx/**/*.json'
      - 'resources/profiles/Cosmyx/ztool_generate_cosmyx_json.py'
      - '.github/workflows/cosmyx_regenerate_json.yml'

jobs:
  regenerate-json:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: resources/profiles/Cosmyx

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Delete existing cosmyx.json
        run: |
          if [ -f cosmyx.json ]; then
            echo "Deleting cosmyx.json..."
            rm cosmyx.json
          else
            echo "No cosmyx.json found to delete"
          fi

      - name: Generate new cosmyx.json
        run: |
          echo "Running generation script..."
          python ztool_generate_cosmyx_json.py

      - name: Check for changes
        id: verify_diff
        run: |
          # Check git status from repository root for cosmyx.json only
          cd ../../..
          if git diff --quiet resources/profiles/Cosmyx/cosmyx.json; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "Changes detected in cosmyx.json"
            git diff --stat resources/profiles/Cosmyx/cosmyx.json
          fi

      - name: Commit and push changes
        if: steps.verify_diff.outputs.changed == 'true'
        run: |
          cd ../../..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add resources/profiles/Cosmyx/cosmyx.json
          git commit -m "chore(cosmyx): regenerate cosmyx.json [skip ci]"
          git push
