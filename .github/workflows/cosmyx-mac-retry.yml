# Cosmyx: reruns the failed jobs of a "Build all" run when a macOS job was
# cancelled because GitHub could not acquire a hosted runner (decision 0217).
# workflow_run only fires from the copy of this file on the default branch.
name: Cosmyx macOS runner retry

on:
  workflow_run:
    workflows: ["Build all"]
    types: [completed]

permissions:
  actions: write
  checks: read

concurrency:
  group: cosmyx-mac-retry-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  retry:
    name: Retry macOS jobs without a runner
    if: ${{ github.event.workflow_run.conclusion == 'failure' || github.event.workflow_run.conclusion == 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RUN_ID: ${{ github.event.workflow_run.id }}
      RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
      RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
      MAC_RETRY_MAX_ATTEMPTS: ${{ vars.COSMYX_MAC_RETRY_MAX_ATTEMPTS || '5' }}
      MAC_RETRY_WAIT_SECONDS: ${{ vars.COSMYX_MAC_RETRY_WAIT_SECONDS || '900' }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/cosmyx/ci

      - name: Decide
        id: decide
        run: python3 scripts/cosmyx/ci/mac_retry.py decide

      - name: Wait for a hosted macOS runner to free up
        if: ${{ steps.decide.outputs.rerun == 'true' }}
        run: sleep "$MAC_RETRY_WAIT_SECONDS"

      - name: Rerun the failed jobs
        if: ${{ steps.decide.outputs.rerun == 'true' }}
        run: python3 scripts/cosmyx/ci/mac_retry.py rerun
